version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    ECR_REPO: claim-status-api
    CLUSTER_NAME: claim-cluster

phases:
  install:
    runtime-versions:
      docker: 20
    commands:
      - echo Installing kubectl
      - curl -o kubectl https://amazon-eks.s3.us-east-1.amazonaws.com/1.29.0/2024-01-04/bin/linux/amd64/kubectl
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/

  pre_build:
    commands:
      - echo Logging in to ECR
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 932490240713.dkr.ecr.$AWS_REGION.amazonaws.com
      - IMAGE_TAG=latest

  build:
    commands:
      - echo Building Docker image
      - docker build -t $ECR_REPO:$IMAGE_TAG .
      - docker tag $ECR_REPO:$IMAGE_TAG 932490240713.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing image
      - docker push 932490240713.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG
      - echo Updating kubeconfig
      - aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION
      - echo Deploying to EKS
      - kubectl apply -f k8s/deployment.yaml
      - kubectl apply -f k8s/service.yaml
