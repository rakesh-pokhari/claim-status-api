version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 071517866612.dkr.ecr.us-east-1.amazonaws.com

  build:
    commands:
      - echo Build started on `date`
      - docker build -t claim-status-api .
      - docker tag claim-status-api:latest 071517866612.dkr.ecr.us-east-1.amazonaws.com/claim-status-api:latest

  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push 071517866612.dkr.ecr.us-east-1.amazonaws.com/claim-status-api:latest
